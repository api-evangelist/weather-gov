modified: '2026-05-19'
description: >-
  Weather.gov is the official website of the National Weather Service (NWS), operated by NOAA within the US Department
  of Commerce. The NWS provides weather, hydrologic, and climate forecasts and warnings for the United States, its
  territories, adjacent waters, and ocean areas. The Weather.gov API provides free, open access to forecasts, alerts,
  observations, radar data, aviation weather, and geographic zone information across all 50 states and territories.
